name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci && (cd server && npm ci)

      - name: Build Project
        run: npm run build

      - name: Run E2E Tests
        run: npx playwright install --with-deps && npx playwright test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-test # Only run deploy if build-and-test job succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        run: |
          # Install Ansible
          pip install ansible

          # Create a temporary inventory file for the runner
          echo "[lanisdeb]" > inventory.tmp
          echo "${{ secrets.VPS_HOST }} ansible_user=${{ secrets.VPS_USER }}" >> inventory.tmp

          # Run the deployment playbook
          ansible-playbook -i inventory.tmp deploy/ansible_deploy.yml