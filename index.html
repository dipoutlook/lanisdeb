<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanisdeb African & Caribbean Market</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            heading: ['Playfair Display', 'serif'],
          },
          colors: {
            'brand-purple': '#4A148C',
            'brand-gold': '#FFC107',
            'brand-bg-light': '#F8F7F5',
            'brand-text-dark': '#333333',
            'brand-text-light': '#666666',
            'background': '#FFFFFF',
            'primary': '#4A148C',
            'primary-foreground': '#FFFFFF',
            'secondary': '#F1F5F9',
            'secondary-foreground': '#333333',
            'muted': '#F1F5F9',
            'muted-foreground': '#64748B',
            'card': '#FFFFFF',
            'card-foreground': '#333333',
            'border': '#E2E8F0',
            'input': '#ced4da',
            'ring': '#4A148C',
          },
          backgroundImage: {
              'gradient-hero': 'linear-gradient(to right, #4A148C, #7b1fa2)',
          },
          boxShadow: {
              'elevate': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>
  <style type="text/css">
    body {
        font-family: 'Poppins', sans-serif;
    }
    .font-heading {
        font-family: 'Playfair Display', serif;
    }
    #root:empty::before {
      content: 'Loading Lanisdeb Market...';
      display: block;
      text-align: center;
      padding-top: 5rem;
      font-size: 1.5rem;
      font-family: 'Poppins', sans-serif;
    }
    /* Animations for Cart */
    @keyframes scale-up {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .animate-scale-up {
      animation: scale-up 0.3s ease-in-out;
    }

    @keyframes flash-bg {
      0% { background-color: transparent; }
      50% { background-color: #FFC10740; } /* Light brand-gold */
      100% { background-color: transparent; }
    }
    .animate-flash-bg {
      animation: flash-bg 0.6s ease-in-out;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "lucide-react": "https://aistudiocdn.com/lucide-react@^0.545.0"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
